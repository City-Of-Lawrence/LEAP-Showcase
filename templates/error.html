{% extends "base.html" %}
{% block title %}{{ t('error_title') }} · Lawrence Energy Program{% endblock %}

{% block content %}
<div class="card" style="text-align:center;">
  <div style="font-size:3rem; margin-bottom:0.5rem;">⚠️</div>
  <h1 style="color:#c8392b;">{{ t('error_title') }}</h1>
  <p class="subtitle" style="margin-top:0.8rem;">
    {{ message | safe }}
  </p>
  <div class="btn-row" style="justify-content:center; margin-top:1.5rem;">
    <a href="{{ url_for('public.index') }}" class="btn btn-secondary">{{ t('error_start_over_btn') }}</a>
  </div>
  <p style="margin-top:1.5rem; font-size:0.83rem; color:#777;">
    {{ t('error_need_help') }} <a href="tel:9783159255">(978) 315-9255</a>
    {{ t('error_or_visit') }}
  </p>
</div>
{% endblock %}
