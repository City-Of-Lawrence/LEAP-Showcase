{% extends "base.html" %}
{% block title %}Error · Lawrence Energy Program{% endblock %}

{% block content %}
<div class="card" style="text-align:center;">
  <div style="font-size:3rem; margin-bottom:0.5rem;">⚠️</div>
  <h1 style="color:#c8392b;">Something Went Wrong</h1>
  <p class="subtitle" style="margin-top:0.8rem;">
    {{ message | safe }}
  </p>
  <div class="btn-row" style="justify-content:center; margin-top:1.5rem;">
    <a href="{{ url_for('index') }}" class="btn btn-secondary">← Start Over</a>
  </div>
  <p style="margin-top:1.5rem; font-size:0.83rem; color:#777;">
    Need help? Call <a href="tel:9783159255">(978) 315-9255</a>
    or visit City Hall.
  </p>
</div>
{% endblock %}
